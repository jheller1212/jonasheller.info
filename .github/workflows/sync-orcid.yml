name: Sync ORCID

# Refreshes the publication snapshot from ORCID and opens a pull request when
# — and only when — the record actually changed. Nothing reaches the site
# without a human merge.
#
# The sync writes a `fetchedAt` stamp on every run, so the file always differs
# after running it. The comparison below therefore ignores that stamp and looks
# only at the `works` array; otherwise this would raise an empty PR every week.

on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Record the current works list
        run: |
          node -e "
            const fs = require('fs');
            const { works } = require('./src/data/orcid-works.json');
            fs.writeFileSync('/tmp/works-before.json', JSON.stringify(works));
          "

      - name: Fetch from ORCID
        run: npm run sync:orcid

      - name: Did anything actually change?
        id: check
        run: |
          node -e "
            const fs = require('fs');
            const before = fs.readFileSync('/tmp/works-before.json', 'utf8');
            const after = JSON.stringify(require('./src/data/orcid-works.json').works);
            const changed = before !== after;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'changed=' + changed + '\n');
            console.log(changed ? 'ORCID record changed.' : 'No change; discarding the refetch.');
          "

      # Leave the tree clean when only the timestamp moved.
      - name: Discard a no-op refetch
        if: steps.check.outputs.changed == 'false'
        run: git checkout -- src/data/orcid-works.json

      # A new or renamed work can break selectedIds in the overlay, which throws
      # at import. Never propose a change that does not build.
      - name: Verify the site still builds
        if: steps.check.outputs.changed == 'true'
        run: |
          npx tsc --noEmit
          npm run build

      - name: Open a pull request
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="orcid-sync/${{ github.run_number }}"
          git config user.name "Jonas Heller"
          git config user.email "168646044+jheller1212@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/data/orcid-works.json
          git commit -m "Refresh the publication snapshot from ORCID

          Generated by the scheduled sync. Review the diff before merging: a
          new work may need a section, a title override, or an entry removing
          from the overlay if it was a stopgap."
          git push origin "$BRANCH"

          SUMMARY=$(node -e "
            const { works } = require('./src/data/orcid-works.json');
            console.log(works.length + ' works now in the snapshot.');
          ")

          gh pr create \
            --title "Refresh the publication snapshot from ORCID" \
            --body "The scheduled ORCID sync found a change.

          $SUMMARY

          **Check before merging:**
          - Does a new work need a section? Reviews and editorials are classified by id in \`publications-overlay.ts\`; everything else falls back to its ORCID type.
          - Is its title abbreviated in ORCID? Add a \`titleOverrides\` entry.
          - Was it previously a stopgap in \`extraWorks\`? Remove the duplicate.
          - Did an id change? \`selectedIds\` throws at build time if a featured paper goes missing, so a green build means the seven are intact.

          Volume, issue, pages and author order come from Crossref; open-access status from OpenAlex. Raised automatically — nothing is live until this is merged." \
            --head "$BRANCH" \
            --base main
